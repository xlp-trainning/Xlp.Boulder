<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xlp.Boulder</title>
<meta name="description" content="Xlp.Boulder: los bloques abiertos de Natural Patraix y Natural Benimaclet, por nivel y estilo, con la beta del equipador.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Xlp.Boulder">
<meta property="og:title" content="Xlp.Boulder">
<meta property="og:description" content="Los bloques abiertos de Natural Patraix y Natural Benimaclet. Puntúalos, guarda tus favoritos y mira la beta.">
<meta property="og:image" content="https://xlp-trainning.github.io/Xlp.Boulder/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#18201E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xlp.Boulder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="label" id="gymName">Rocódromo</div>
      <h1 class="wordmark" aria-label="Xlp.Boulder">
        <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#18201E"/>   <!-- X de dos tiras de cinta de salida, y el punto de Xlp.Boulder -->   <g transform="translate(236 236)">     <rect x="-170" y="-46" width="340" height="92" rx="14" fill="#F5CE1B" transform="rotate(45)"/>     <rect x="-170" y="-46" width="340" height="92" rx="14" fill="#4CC3A8" transform="rotate(-45)"/>     <path d="M-150 -10h300M-150 10h300" stroke="#18201E" stroke-opacity=".18" stroke-width="6" transform="rotate(-45)"/>   </g>   <circle cx="420" cy="420" r="44" fill="#F8FAF9"/></svg>
        <span aria-hidden="true">XLP<span class="wm-dot">.</span>BOULDER</span>
      </h1>
      <p>Todos los problemas abiertos en la sala, por nivel y estilo. Puntúalos, guarda tus favoritos y mira la beta.</p>
      <div class="gympick" id="gymPick" role="group" aria-label="Rocódromo" hidden></div>
    </div>
    <div class="row">
      <span class="status" id="who"></span>
      <button class="btn primary" id="addBtn" hidden>+ Nuevo bloque</button>
    </div>
  </header>

  <nav class="mainnav" aria-label="Secciones">
    <button data-page="bloques" aria-current="page">Bloques</button>
    <button data-page="mapa">Mapa</button>
    <button data-page="ranking">Ranking</button>
    <button data-page="progreso">Mi progreso</button>
    <button data-page="stats" hidden>Estadísticas</button>
  </nav>

  <div id="page-bloques" class="page">
    <section class="dist" aria-label="Bloques por nivel">
      <div class="dist-head">
        <div class="total"><span id="totalN">0</span><small id="totalLbl">bloques abiertos</small></div>
        <span class="note">De fácil a difícil · toca un nivel para filtrar</span>
      </div>
      <div class="bars-scroll"><div class="bars" id="bars"></div></div>
    </section>

    <section class="filters" aria-label="Filtros">
      <div class="tabs-scroll">
        <div class="tabs" role="group" aria-label="Vista">
          <button data-view="open" aria-pressed="true">Abiertos</button>
          <button data-view="new" aria-pressed="false">Novedades</button>
          <button data-view="fav" aria-pressed="false">♥ Favoritos</button>
          <button data-view="proj" aria-pressed="false">Proyectos</button>
          <button data-view="old" aria-pressed="false">Desmontados</button>
        </div>
      </div>
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Buscar por nombre, sector o beta…" aria-label="Buscar">
        <select class="sort" id="sort" aria-label="Ordenar">
          <option value="new">Más recientes</option>
          <option value="gradeAsc">Más fáciles primero</option>
          <option value="gradeDesc">Más difíciles primero</option>
          <option value="rating">Mejor puntuados</option>
        </select>
      </div>
      <div class="row" id="styleChips"></div>
      <div class="row" id="colorChips"></div>
    </section>

    <main id="list"></main>
  </div>

  <div id="page-mapa" class="page" hidden></div>
  <div id="page-ranking" class="page" hidden></div>
  <div id="page-progreso" class="page" hidden></div>
  <div id="page-stats" class="page" hidden></div>

  <footer class="foot">
    <span class="foot-brand">Xlp.Boulder · bloques equipados en Natural Patraix y Natural Benimaclet</span>
    <button class="linkbtn" id="loginBtn">Acceso equipador</button>
  </footer>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
<script src="progreso.js"></script>
<script src="historias.js"></script>
<script src="ranking.js"></script>
<script src="wrapped.js"></script>
<script src="estadisticas.js"></script>
</body>
</html>
